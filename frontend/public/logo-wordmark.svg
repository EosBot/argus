<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100" fill="none" role="img" aria-label="ARGUS 2.0 — Hunt deeper. Find everything.">
  <defs>
    <radialGradient id="wglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wsweep" x1="50" y1="50" x2="50" y2="4">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="wglow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo mark (left) -->
  <g transform="translate(0, 0)">
    <!-- Ambient glow -->
    <circle cx="50" cy="50" r="46" fill="url(#wglow)"/>

    <!-- Radar rings -->
    <circle cx="50" cy="50" r="38" stroke="#00FF41" stroke-opacity="0.10" stroke-width="0.5"/>
    <circle cx="50" cy="50" r="28" stroke="#00FF41" stroke-opacity="0.14" stroke-width="0.5"/>
    <circle cx="50" cy="50" r="18" stroke="#00FF41" stroke-opacity="0.18" stroke-width="0.5"/>

    <!-- Cross-hairs -->
    <line x1="50" y1="8" x2="50" y2="92" stroke="#00FF41" stroke-opacity="0.08" stroke-width="0.4"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke="#00FF41" stroke-opacity="0.08" stroke-width="0.4"/>

    <!-- Radar sweep arc -->
    <path d="M50,50 L50,4 A46,46 0 0,1 91.2,68.5 Z" fill="url(#wsweep)" opacity="0.35"/>

    <!-- Sweep arm -->
    <line x1="50" y1="50" x2="85.4" y2="63.4" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- Hexagon of nodes -->
    <polygon
      points="50,14 78,30 78,62 50,78 22,62 22,30"
      stroke="#00FF41"
      stroke-width="1.4"
      stroke-linejoin="round"
      fill="none"
      filter="url(#wglow-filter)"
    />

    <!-- Inner hexagon -->
    <polygon
      points="50,24 69,35 69,57 50,68 31,57 31,35"
      stroke="#00FF41"
      stroke-width="0.5"
      stroke-opacity="0.25"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Node vertices -->
    <circle cx="50" cy="14" r="2.2" fill="#00FF41" filter="url(#wglow-filter)"/>
    <circle cx="78" cy="30" r="2.2" fill="#00FF41" filter="url(#wglow-filter)"/>
    <circle cx="78" cy="62" r="2.2" fill="#00FF41" filter="url(#wglow-filter)"/>
    <circle cx="50" cy="78" r="2.2" fill="#00FF41" filter="url(#wglow-filter)"/>
    <circle cx="22" cy="62" r="2.2" fill="#00FF41" filter="url(#wglow-filter)"/>
    <circle cx="22" cy="30" r="2.2" fill="#00FF41" filter="url(#wglow-filter)"/>

    <!-- Inner nodes (amber) -->
    <circle cx="50" cy="24" r="1.4" fill="#FFB020" fill-opacity="0.85"/>
    <circle cx="69" cy="35" r="1.4" fill="#FFB020" fill-opacity="0.85"/>
    <circle cx="69" cy="57" r="1.4" fill="#FFB020" fill-opacity="0.85"/>
    <circle cx="50" cy="68" r="1.4" fill="#FFB020" fill-opacity="0.85"/>
    <circle cx="31" cy="57" r="1.4" fill="#FFB020" fill-opacity="0.85"/>
    <circle cx="31" cy="35" r="1.4" fill="#FFB020" fill-opacity="0.85"/>

    <!-- Mesh connections -->
    <line x1="50" y1="14" x2="50" y2="24" stroke="#00FF41" stroke-opacity="0.3" stroke-width="0.5"/>
    <line x1="78" y1="30" x2="69" y2="35" stroke="#00FF41" stroke-opacity="0.3" stroke-width="0.5"/>
    <line x1="78" y1="62" x2="69" y2="57" stroke="#00FF41" stroke-opacity="0.3" stroke-width="0.5"/>
    <line x1="50" y1="78" x2="50" y2="68" stroke="#00FF41" stroke-opacity="0.3" stroke-width="0.5"/>
    <line x1="22" y1="62" x2="31" y2="57" stroke="#00FF41" stroke-opacity="0.3" stroke-width="0.5"/>
    <line x1="22" y1="30" x2="31" y2="35" stroke="#00FF41" stroke-opacity="0.3" stroke-width="0.5"/>

    <!-- Diagonal mesh -->
    <line x1="50" y1="24" x2="69" y2="35" stroke="#00FF41" stroke-opacity="0.15" stroke-width="0.4"/>
    <line x1="69" y1="35" x2="69" y2="57" stroke="#00FF41" stroke-opacity="0.15" stroke-width="0.4"/>
    <line x1="69" y1="57" x2="50" y2="68" stroke="#00FF41" stroke-opacity="0.15" stroke-width="0.4"/>
    <line x1="50" y1="68" x2="31" y2="57" stroke="#00FF41" stroke-opacity="0.15" stroke-width="0.4"/>
    <line x1="31" y1="57" x2="31" y2="35" stroke="#00FF41" stroke-opacity="0.15" stroke-width="0.4"/>
    <line x1="31" y1="35" x2="50" y2="24" stroke="#00FF41" stroke-opacity="0.15" stroke-width="0.4"/>

    <!-- Central eye -->
    <g filter="url(#wglow-filter)">
      <path
        d="M38,50 Q50,38 62,50 Q50,62 38,50 Z"
        fill="none"
        stroke="#00F0FF"
        stroke-width="1.2"
        stroke-linejoin="round"
      />
      <circle cx="50" cy="50" r="5.5" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="0.8"/>
      <circle cx="50" cy="50" r="2.2" fill="#00FF41"/>
      <circle cx="52" cy="48" r="0.8" fill="#f8fafc" fill-opacity="0.9"/>
    </g>

    <!-- Secondary eye -->
    <g opacity="0.5">
      <path
        d="M68,38 Q74,33 80,38 Q74,43 68,38 Z"
        fill="none"
        stroke="#00F0FF"
        stroke-width="0.6"
        stroke-linejoin="round"
      />
      <circle cx="74" cy="38" r="1.8" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="0.5"/>
      <circle cx="74" cy="38" r="0.8" fill="#00FF41"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(108, 0)">
    <!-- ARGUS text -->
    <text
      x="0" y="58"
      font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
      font-size="36"
      font-weight="700"
      letter-spacing="4"
      fill="#00FF41"
      filter="url(#wglow-filter)"
    >ARGUS</text>

    <!-- Tagline -->
    <text
      x="0" y="78"
      font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
      font-size="9"
      font-weight="400"
      letter-spacing="2.5"
      fill="#94a3b8"
    >HUNT DEEPER. FIND EVERYTHING.</text>

    <!-- Version badge -->
    <g transform="translate(138, 42)">
      <rect x="0" y="0" width="28" height="14" rx="2" fill="none" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="0.6"/>
      <text
        x="14" y="10"
        font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
        font-size="7"
        font-weight="600"
        text-anchor="middle"
        fill="#00F0FF"
      >2.0</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="ARGUS 2.0 favicon">
  <defs>
    <radialGradient id="fsweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#030712" stroke="#00FF41" stroke-width="1.2"/>

  <!-- Radar sweep -->
  <path d="M16,16 L16,2 A14,14 0 0 1 25.9,6.1 Z" fill="url(#fsweep)" opacity="0.5"/>
  <line x1="16" y1="16" x2="25.9" y2="6.1" stroke="#00F0FF" stroke-width="0.4" stroke-opacity="0.6"/>

  <!-- Hexagon -->
  <polygon
    points="22.1,16 19.05,21.29 12.95,21.29 9.9,16 12.95,10.71 19.05,10.71"
    fill="none"
    stroke="#00FF41"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Hex spokes -->
  <line x1="16" y1="16" x2="22.1" y2="16" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="19.05" y2="21.29" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="12.95" y2="21.29" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="9.9" y2="16" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="12.95" y2="10.71" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="19.05" y2="10.71" stroke="#00FF41" stroke-width="0.6" stroke-opacity="0.7"/>

  <!-- Node vertices -->
  <circle cx="22.1" cy="16" r="1.2" fill="#FFB020"/>
  <circle cx="19.05" cy="21.29" r="1.2" fill="#FFB020"/>
  <circle cx="12.95" cy="21.29" r="1.2" fill="#FFB020"/>
  <circle cx="9.9" cy="16" r="1.2" fill="#FFB020"/>
  <circle cx="12.95" cy="10.71" r="1.2" fill="#FFB020"/>
  <circle cx="19.05" cy="10.71" r="1.2" fill="#FFB020"/>

  <!-- Central eye -->
  <circle cx="16" cy="16" r="3" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="1.6" fill="#00FF41"/>
  <circle cx="16" cy="16" r="0.7" fill="#030712"/>
</svg>

# =============================================================================
# LiteLLM Gateway Configuration — ARGUS 2.0
# =============================================================================
# Gateway unificado para 100+ providers de LLM via LiteLLM
# (https://github.com/BerriAI/litellm)
#
# O sistema funciona 100% com providers GRATUITOS (Ollama, vLLM, LM Studio,
# Hugging Face, Together AI) SEM necessidade de API keys.
#
# Providers PAGOS estão comentados — basta descomentar e adicionar a API key
# via variável de ambiente (NUNCA coloque keys reais neste arquivo).
#
# Interface única: TODOS os providers expõem a mesma API no formato OpenAI
# (POST /chat/completions) através do gateway.
# =============================================================================

# -----------------------------------------------------------------------------
# INSTRUÇÕES PARA ADICIONAR API KEYS
# -----------------------------------------------------------------------------
# 1. Exporte a key como variável de ambiente (recomendado):
#      export OPENAI_API_KEY="sk-..."
#      export ANTHROPIC_API_KEY="sk-ant-..."
#      export GEMINI_API_KEY="AIza..."
#      export TOGETHERAI_API_KEY="..."
#      export DEEPSEEK_API_KEY="..."
#      export GROQ_API_KEY="gsk_..."
#      export COHERE_API_KEY="..."
#      export AZURE_API_KEY="..."
#      export AWS_ACCESS_KEY_ID="..." && export AWS_SECRET_ACCESS_KEY="..."
#      export NVIDIA_NIM_API_KEY="nvapi-..."
#      export PERPLEXITY_API_KEY="pplx-..."
#      export XAI_API_KEY="xai-..."
#      export MISTRAL_API_KEY="..."
# 2. OU defina as keys no arquivo .env do projeto (carregado pelo LiteLLM).
# 3. Descomente o bloco do provider desejado abaixo.
# 4. Reinicie o gateway:  litellm --config config/litellm_config.yaml
#
# O LiteLLM lê automaticamente as variáveis de ambiente padrão de cada
# provider (OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.) — não é necessário
# repetir a key no YAML quando a env var está definida.
# =============================================================================

# -----------------------------------------------------------------------------
# MODEL LIST — catálogo de modelos expostos pelo gateway
# -----------------------------------------------------------------------------
# Cada entrada define um "model_name" (nome público usado pelo cliente) e os
# "litellm_params" (como o gateway alcança o provider real).
# -----------------------------------------------------------------------------
model_list:

  # ===========================================================================
  # PROVIDERS GRATUITOS — funcionam sem API keys
  # ===========================================================================

  # --- Ollama (local, 100% gratuito, sem API key) ----------------------------
  # Requer: ollama serve rodando em http://localhost:11434
  # Instale modelos:  ollama pull llama3  |  ollama pull mistral  |  ollama pull codellama
  - model_name: ollama/llama-3
    litellm_params:
      model: ollama/llama3            # nome do modelo no Ollama
      api_base: http://localhost:11434
    model_info:
      mode: completion
      supports_function_calling: true

  - model_name: ollama/mistral
    litellm_params:
      model: ollama/mistral
      api_base: http://localhost:11434
    model_info:
      mode: completion
      supports_function_calling: true

  - model_name: ollama/codellama
    litellm_params:
      model: ollama/codellama
      api_base: http://localhost:11434
    model_info:
      mode: completion
      supports_function_calling: true

  # --- vLLM (local, gratuito, servidor OpenAI-compatível) --------------------
  # Requer: vllm serve <modelo> --port 8000
  - model_name: vllm/llama-3-8b
    litellm_params:
      model: openai/llama-3-8b-instruct   # prefixo openai/ = formato OpenAI
      api_base: http://localhost:8000/v1
      api_key: dummy                       # vLLM local não valida keys
    model_info:
      mode: completion

  # --- LM Studio (local, gratuito) -------------------------------------------
  # Requer: LM Studio rodando com servidor local ativo (porta padrão 1234)
  - model_name: lmstudio/local-model
    litellm_params:
      model: openai/lmstudio-model
      api_base: http://localhost:1234/v1
      api_key: dummy
    model_info:
      mode: completion

  # --- Hugging Face Inference (gratuito com token HF opcional) ---------------
  # Sem token: usa a quota gratuita. Com token: export HF_TOKEN=...
  - model_name: hf/mistral-7b
    litellm_params:
      model: huggingface/mistralai/Mistral-7B-Instruct-v0.3
      api_base: https://api-inference.huggingface.co/models
    model_info:
      mode: completion

  - model_name: hf/llama-3-8b
    litellm_params:
      model: huggingface/meta-llama/Meta-Llama-3-8B-Instruct
      api_base: https://api-inference.huggingface.co/models
    model_info:
      mode: completion

  # --- Together AI (gratuito com quota de trial, key opcional) ---------------
  # Sem key: funciona com quota gratuita. Com key: export TOGETHERAI_API_KEY=...
  - model_name: together/llama-3-8b
    litellm_params:
      model: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Turbo
    model_info:
      mode: completion

  - model_name: together/mistral-7b
    litellm_params:
      model: together_ai/mistralai/Mistral-7B-Instruct-v0.3
    model_info:
      mode: completion

  # ===========================================================================
  # PROVIDERS PAGOS — descomente o bloco e defina a API key via env var
  # ===========================================================================

  # --- OpenAI ----------------------------------------------------------------
  # Key: export OPENAI_API_KEY="sk-..."

# -----------------------------------------------------------------------------
# ROUTER SETTINGS — fallback automático e balanceamento
# -----------------------------------------------------------------------------
# Estratégia de fallback (em ordem):
#   1. Ollama (local, gratuito) → 2. Together AI (gratuito) → 3. Provider pago
# Se o primeiro provider falhar (timeout, rate limit, erro), o LiteLLM tenta
# automaticamente o próximo da cadeia sem intervenção do cliente.
# -----------------------------------------------------------------------------
router_settings:
  # Cadeia de fallback: tenta Ollama primeiro, depois Together, depois pago
  fallbacks:
    - {"ollama/llama-3": ["together/llama-3-8b", "openai/gpt-4o-mini"]}
    - {"ollama/mistral": ["together/mistral-7b", "openai/gpt-4o-mini"]}
    - {"ollama/codellama": ["together/llama-3-8b", "openai/gpt-4o-mini"]}
    - {"together/llama-3-8b": ["openai/gpt-4o-mini"]}
    - {"together/mistral-7b": ["openai/gpt-4o-mini"]}

  # Balanceamento de carga entre modelos equivalentes (round-robin)
  routing_strategy: "simple-shuffle"

  # Número de tentativas antes de desistir
  num_retries: 3

  # Tempo máximo de espera por resposta (segundos)
  request_timeout: 600

  # Cooldown após falha de um provider (segundos)
  cooldown_time: 30

  # Permitir que o cliente sobrescreva o modelo via parâmetro
  enable_pre_call_checks: true

  # Distribuição de peso entre modelos do mesmo grupo (default: igual)
  # model_group_alias: {}

# -----------------------------------------------------------------------------
# CACHE — reduz custos e latência em chamadas repetidas
# -----------------------------------------------------------------------------
litellm_settings:
  # Cache semântico em memória (desative em produção multi-instância)
  cache: true
  cache_params:
    type: redis            # use "redis" em produção; "local" para dev
    supported_call_types: ["completion", "acompletion"]
    ttl: 3600              # 1 hora

  # Log de custo por chamada (requer tabela de preços do LiteLLM)
  # turn_off_message_logging: false

  # Drop params desconhecidos em vez de falhar
  drop_params: true

# -----------------------------------------------------------------------------
# SERVIDOR — interface unificada OpenAI-format
# -----------------------------------------------------------------------------
general_settings:
  # Porta do gateway (padrão LiteLLM: 4000)
  # master_key: os.environ/LITELLM_MASTER_KEY   # descomente para proteger o gateway

  # Endpoint de health check: GET /health/liveliness
  # health_check: true

  # Database para tracking de uso (opcional)
  # database_url: os.environ/DATABASE_URL